        h('h3', { texto: 'Resistência' }),

        h('p', { texto: R.memoria_mb ? 'Memória do sistema: ' + R.memoria_mb.depois_do_aquecimento + ' MB depois do aquecimento, ' + R.memoria_mb.fim + ' MB no fim (' + (R.memoria_mb.crescimento_pct >= 0 ? '+' : '') + R.memoria_mb.crescimento_pct + '%).' : 'Memória do sistema não medida.' }),
        h('p', { class: 'marca-sev', style: 'color:' + (okR ? 'var(--ok)' : 'var(--critica)'), texto: okR ? 'Estável.' : R.memoria_crescendo ? 'Memória crescendo sem voltar.' : 'Fora dos limites.' })));
    }
    if (C.volumes && C.volumes.length) {
      secC.appendChild(h('h3', { texto: 'Volume de dados', style: 'margin-top:26px' }));
      secC.appendChild(h('div', { class: 'rolagem' }, h('table', null,
        h('thead', null, h('tr', null, ['Volume', 'p95', 'Erro', 'Memória do sistema (máx.)'].map(function (t) { return h('th', { scope: 'col', texto: t }); }))),
        h('tbody', null, C.volumes.map(function (v) {
          return h('tr', null, h('td', { texto: v.volume }), h('td', { texto: ms(v.p95_ms) }), h('td', { texto: pct(v.taxa_erro) }), h('td', { texto: v.memoria_alvo_mb ? v.memoria_alvo_mb.max + ' MB' : 'não medida' }));
        })))));
    }
    (C.alertas || []).forEach(function (a) { secC.appendChild(h('p', { class: 'alerta', texto: a })); });
    raiz.appendChild(secC);
  }

  function barrasErro(curva) {
    var W = 400, H = 280, m = { e: 46, d: 10, t: 16, b: 34 };
    var maiorErro = Math.max.apply(null, curva.map(function (p) { return p.taxa_erro || 0; }));
    var maxE = Math.max(0.05, maiorErro);
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Taxa de erro por degrau' });
    if (maiorErro === 0) svg.appendChild(s('text', { x: (W + m.e) / 2, y: H / 2, 'text-anchor': 'middle', class: 'eixo', texto: 'Nenhum erro em nenhum degrau' }));
    var bw = (W - m.e - m.d) / curva.length;
    [0, 0.5, 1].forEach(function (f) {
      var y = H - m.b - f * (H - m.t - m.b);
      svg.appendChild(s('line', { x1: m.e, x2: W - m.d, y1: y, y2: y, class: 'grade-linha' }));
      svg.appendChild(s('text', { x: m.e - 6, y: y + 4, 'text-anchor': 'end', class: 'eixo', texto: (maxE * f * 100).toFixed(1) + '%' }));
    });
    curva.forEach(function (p, i) {
      var alt = ((p.taxa_erro || 0) / maxE) * (H - m.t - m.b);
      var r = s('rect', { x: m.e + i * bw + bw * 0.2, y: H - m.b - alt, width: bw * 0.6, height: Math.max(alt, 0.5), class: 'barra-erro' });
      r.appendChild(s('title', { texto: p.vus + ' usuários: erro ' + pct(p.taxa_erro) }));
      svg.appendChild(r);
      svg.appendChild(s('text', { x: m.e + i * bw + bw / 2, y: H - 12, 'text-anchor': 'middle', class: 'eixo', texto: String(p.vus) }));
    });
    return svg;
  }
  function barrasPassos(passos) {
    var W = 640, linha = 30, m = { e: 190, d: 70 };
    var H = passos.length * linha + 10;
    var max = Math.max.apply(null, passos.map(function (p) { return p.p95_ms || 0; })) || 1;
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'p95 por passo' });
    passos.forEach(function (p, i) {
      var y = i * linha + 6, w = ((p.p95_ms || 0) / max) * (W - m.e - m.d);
      svg.appendChild(s('text', { x: m.e - 10, y: y + 15, 'text-anchor': 'end', class: 'eixo', texto: p.passo }));
      svg.appendChild(s('rect', { x: m.e, y: y + 4, width: Math.max(w, 1), height: 14, rx: 2, class: 'barra-passo' }));
      svg.appendChild(s('text', { x: m.e + w + 8, y: y + 15, class: 'eixo', texto: ms(p.p95_ms) }));
    });
    return svg;
  }

  // Conduta
  if (D.plano && D.plano.grupos && D.plano.grupos.length) {
    var secCo = secao('conduta', 'Conduta: plano de correção');
    secCo.appendChild(h('p', { class: 'suave', texto: 'Na ordem em que vale a pena corrigir. Nada foi aplicado no seu código: cada correção é uma proposta para revisar.' }));
    var DESC = {
      critico: 'Perda de dados, dinheiro ou acesso indevido. Resolva antes de qualquer outra coisa.',
      'ganho-rapido': 'Muito efeito com pouco trabalho.',
      estrutural: 'Mudanças maiores. Cada uma traz um paliativo para já.',
      melhoria: 'Ajustes que deixam o produto melhor.'
    };
    var contador = 0;
    D.plano.grupos.forEach(function (g) {
      var bloco = h('div', { class: 'grupo' }, h('h3', { texto: g.titulo.split(':')[0] }), h('p', { class: 'suave', texto: DESC[g.prioridade] || '' }));
      var ol = h('ol', { class: 'itens', style: '--inicio:' + contador });
      g.itens.forEach(function (i) {
        contador += 1;
        var a = achadoPorId[i.id] || {};
        var corr = a.correcao || {};
        var li = h('li', { class: 'sev-' + i.severidade },
          h('div', null,
            h('strong', { texto: i.titulo }),
            h('div', { class: 'item-meta' },
              h('span', { class: 'marca-sev', texto: SEV[i.severidade] }), ' · ', i.id, ' · ', CAMADA[i.camada] || i.camada || 'camada a definir', ' · ',
              h('span', { class: 'selo selo-' + (i.causa || 'hipotese'), texto: i.causa === 'confirmada' ? 'causa confirmada' : 'causa provável' })),
            i.correcao ? h('p', { texto: i.correcao }) : null,
            corr.passos && corr.passos.length ? h('ol', { class: 'passos-infra' }, corr.passos.map(function (p) { return h('li', { texto: p }); })) : null,
            corr.risco ? h('p', { class: 'suave pequeno' }, h('strong', { texto: 'Risco: ' }), corr.risco) : null,
            corr.custo_infra ? h('p', { class: 'suave pequeno' }, h('strong', { texto: 'Custo: ' }), corr.custo_infra) : null,
            i.revalidar_com ? h('p', { class: 'suave pequeno' }, h('strong', { texto: 'Como provar: ' }), i.revalidar_com) : null,
            D.diffs && D.diffs[i.id] ? h('details', { class: 'diff' }, h('summary', { texto: 'Ver o diff proposto' }), blocoDiff(D.diffs[i.id])) : null));
        ol.appendChild(li);
      });
      bloco.appendChild(ol);
      secCo.appendChild(bloco);
    });
    raiz.appendChild(secCo);
  } else if (D.achados && D.achados.length) {
    var secT = secao('conduta', 'Todos os achados');
    D.achados.forEach(function (a) { secT.appendChild(cartaoAchado(a)); });
    raiz.appendChild(secT);
  }

  // Antes e depois
  if (D.revalidacao && D.revalidacao.itens && D.revalidacao.itens.length) {
    var NOME_RES = { corrigido: 'corrigido', melhorou: 'melhorou', 'sem-mudanca': 'sem mudança', piorou: 'piorou', inconclusivo: 'inconclusivo' };
    var resumoR = D.revalidacao.resumo || {};
    var secR = secao('antes-depois', 'Antes e depois', h('span', { class: 'suave pequeno', texto: Object.keys(resumoR).map(function (k) { return resumoR[k] + ' ' + (NOME_RES[k] || k); }).join(', ') }));
    function curto(o) {
      if (o.texto !== undefined) return o.texto;
      if (o.passou !== undefined && o.status !== undefined) return (o.passou ? 'passou' : 'falhou') + ' (status ' + o.status + (o.criados !== undefined ? ', ' + o.criados + ' criados' : '') + ')';
      if (o.usuarios !== undefined) return (o.pelo_menos ? 'pelo menos ' : '~') + o.usuarios + ' usuários';
      if (o.p95_ms !== undefined) return 'p95 ' + ms(o.p95_ms) + ', erro ' + pct(o.taxa_erro);
      if (o.sucessos !== undefined) return o.sucessos + ' sucessos, ' + (o.verificacao || []).join(' → ');
      return (RES[o.resultado] || ['', o.resultado])[1] + (o.passos != null ? ', ' + o.passos + ' passos' : '');
    }
    secR.appendChild(h('div', { class: 'rolagem' }, h('table', null,
      h('thead', null, h('tr', null, ['O que foi medido', 'Antes', 'Depois', 'Resultado'].map(function (t) { return h('th', { scope: 'col', texto: t }); }))),
      h('tbody', null, D.revalidacao.itens.map(function (i) {
        return h('tr', null, h('td', { texto: i.descricao }), h('td', { texto: curto(i.antes) }), h('td', { texto: curto(i.depois) }),
          h('td', { class: 'res-' + i.resultado, texto: NOME_RES[i.resultado] || i.resultado }));
      })))));
    raiz.appendChild(secR);
  }

  // Limites e método
  var secM = secao('metodo', 'Limites e método');
  secM.classList.add('metodo');
  secM.appendChild(h('ul', null, (D.limites || []).map(function (l) { return h('li', { texto: l }); })));
  var pen = D.penalidades, pes = D.pesos;
  secM.appendChild(h('h3', { texto: 'Como o placar é calculado', style: 'margin-top:18px' }));
  secM.appendChild(h('p', { texto: 'Cada achado tira pontos da nota do exame em que apareceu: crítico ' + pen.critica + ', alto ' + pen.alta + ', médio ' + pen.media + ', baixo ' + pen.baixa + '. A nota de cada exame vai de 0 a 100. O placar é a média ponderada dos exames realizados (personas ' + pes.personas + ', API ' + pes.api + ', carga ' + pes.carga + '); exames não realizados não entram na conta. Com algum achado crítico, o placar fica em no máximo 59.' }));
  if (meta.perfil_evidencias && meta.perfil_evidencias.length) {
    secM.appendChild(h('p', { class: 'suave pequeno', texto: 'Perfil detectado por: ' + meta.perfil_evidencias.join('; ') + '.' }));
  }
  raiz.appendChild(secM);

  // Links com âncora (#conduta, #personas…) só funcionam depois da montagem.
  if (location.hash) {
    var alvo = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (alvo) setTimeout(function () { alvo.scrollIntoView(); }, 0);
  }

  raiz.appendChild(h('footer', null,
    h('span', { texto: 'Gerado pelo prodtester' + (D.versao ? ' ' + D.versao : '') }),
    h('span', { texto: 'Execução ' + D.execucao })));
})();
</script>
</body>
</html>
